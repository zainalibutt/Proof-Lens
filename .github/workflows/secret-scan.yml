name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so the action can enumerate commits on pull requests.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: this repository was history-rewritten before publication,
          # so scanning every reachable commit is the point, not just the tip.
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organisation-owned repositories only.
          # Free for public, user-owned repositories such as this one.
