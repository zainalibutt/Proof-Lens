# Dependabot configuration.
#
# Updates are grouped into a single pull request per ecosystem and capped, so the
# repository does not accumulate dozens of open dependency PRs. Security advisories
# are still raised independently of these limits.

version: 2
updates:
  - package-ecosystem: npm
    directory: /prooflens-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ['*']
