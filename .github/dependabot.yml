# Dependabot configuration.
#
# This preserved research release accepts security-update pull requests only.
# Version-update PRs are disabled with a zero limit; GitHub handles security
# updates separately from that limit.

version: 2
updates:
  - package-ecosystem: npm
    directory: /prooflens-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      all-actions:
        patterns: ['*']
