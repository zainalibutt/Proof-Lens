<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000" font-family="Aptos, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8232f"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f4f5f7; stroke: #c9ccd1; stroke-width: 1; }
      .laneTitle { font-size: 18px; font-weight: 700; fill: #2b2b2b; letter-spacing: 0.3px; }
      .zoneLabel { font-size: 11px; font-weight: 700; fill: #6b6f76; letter-spacing: 1.5px; }
      .node { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.5; }
      .nodeEmph { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2.2; }
      .nodeTitle { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .nodeSub { font-size: 12px; font-style: italic; fill: #555; }
      .nodeBody { font-size: 12.5px; fill: #2b2b2b; }
      .edge { stroke: #2b2b2b; stroke-width: 1.6; fill: none; }
      .edgeRed { stroke: #b8232f; stroke-width: 2.4; fill: none; }
      .edgeDash { stroke: #6b6f76; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .pill { fill: #ffffff; stroke: #6b6f76; stroke-width: 1; }
      .pillRed { fill: #fdecee; stroke: #b8232f; stroke-width: 1.3; }
      .pillText { font-size: 11.5px; fill: #2b2b2b; }
      .pillTextRed { font-size: 11.5px; font-weight: 700; fill: #b8232f; }
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .callout { fill: #fdecee; stroke: #b8232f; stroke-width: 1.6; }
      .calloutTitle { font-size: 13px; font-weight: 700; fill: #b8232f; }
      .calloutBody { font-size: 11.5px; fill: #b8232f; }
      .legendBox { fill: #ffffff; stroke: #c9ccd1; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1000"/>

  <text x="40" y="44" class="title">Figure 5.1 — ProofLens System Architecture</text>
  <text x="40" y="68" class="subtitle">Trust zones: untrusted client · trusted backend · external services · verification. Red path = server-side S3 re-hash (INV-01, fail-closed).</text>

  <!-- Lanes -->
  <rect class="lane" x="30"   y="100" width="350" height="830" rx="10"/>
  <rect class="lane" x="400"  y="100" width="470" height="830" rx="10"/>
  <rect class="lane" x="890"  y="100" width="400" height="830" rx="10"/>
  <rect class="lane" x="1310" y="100" width="360" height="830" rx="10"/>

  <text x="205"  y="128" class="laneTitle" text-anchor="middle">Client Layer</text>
  <text x="635"  y="128" class="laneTitle" text-anchor="middle">Backend</text>
  <text x="1090" y="128" class="laneTitle" text-anchor="middle">Storage Layer</text>
  <text x="1490" y="128" class="laneTitle" text-anchor="middle">Verification Layer</text>

  <!-- Trust zone sub-labels -->
  <text x="205"  y="148" class="zoneLabel" text-anchor="middle">UNTRUSTED</text>
  <text x="635"  y="148" class="zoneLabel" text-anchor="middle">TRUST ANCHOR</text>
  <text x="1090" y="148" class="zoneLabel" text-anchor="middle">INTEGRITY-CONSTRAINED</text>
  <text x="1490" y="148" class="zoneLabel" text-anchor="middle">READ-ONLY</text>

  <!-- Mobile App -->
  <rect class="node" x="55" y="430" width="300" height="180" rx="10"/>
  <text x="205" y="462" class="nodeTitle" text-anchor="middle">Mobile App (Expo React Native)</text>
  <text x="75" y="492" class="nodeBody">• photo + audio capture</text>
  <text x="75" y="514" class="nodeBody">• SHA-256 on-device</text>
  <text x="75" y="536" class="nodeBody">• Ed25519 signing</text>
  <text x="75" y="558" class="nodeBody">• AsyncStorage queue;</text>
  <text x="75" y="578" class="nodeBody">  no AWS credentials</text>

  <!-- Express API -->
  <rect class="nodeEmph" x="440" y="410" width="390" height="220" rx="10"/>
  <text x="635" y="444" class="nodeTitle" text-anchor="middle">API Server (Express / Node, Railway)</text>
  <text x="635" y="464" class="nodeSub" text-anchor="middle">Single decision point — trust anchor</text>
  <text x="465" y="498" class="nodeBody">• presign media</text>
  <text x="465" y="522" class="nodeBody">• server-side hash recomputation</text>
  <text x="465" y="546" class="nodeBody">• signature + device verification</text>
  <text x="465" y="570" class="nodeBody">• RFC 3161 TSA integration</text>

  <!-- AWS S3 -->
  <rect class="node" x="925" y="170" width="330" height="140" rx="10"/>
  <text x="1090" y="202" class="nodeTitle" text-anchor="middle">AWS S3 Object Storage</text>
  <text x="945" y="232" class="nodeBody">• media objects</text>
  <text x="945" y="254" class="nodeBody">• TSA .tsr sidecars</text>
  <text x="945" y="280" class="nodeSub">  presigned POST uploads only</text>

  <!-- Supabase PostgreSQL -->
  <rect class="node" x="925" y="420" width="330" height="180" rx="10"/>
  <text x="1090" y="452" class="nodeTitle" text-anchor="middle">PostgreSQL (Supabase)</text>
  <text x="945" y="482" class="nodeBody">• credentials, audio_records,</text>
  <text x="945" y="500" class="nodeBody">  bursts, drafts</text>
  <text x="945" y="524" class="nodeBody">• device_keys, shares, audit</text>
  <text x="945" y="548" class="nodeBody">• FORCE RLS +</text>
  <text x="945" y="566" class="nodeBody">  immutability triggers</text>

  <!-- FreeTSA -->
  <rect class="node" x="925" y="710" width="330" height="120" rx="10"/>
  <text x="1090" y="742" class="nodeTitle" text-anchor="middle">RFC 3161 TSA (FreeTSA)</text>
  <text x="945" y="772" class="nodeBody">• timestamp query / response</text>
  <text x="945" y="794" class="nodeSub">  external trusted time source</text>

  <!-- Web Dashboard -->
  <rect class="node" x="1345" y="430" width="290" height="180" rx="10"/>
  <text x="1490" y="462" class="nodeTitle" text-anchor="middle">Web Dashboard</text>
  <text x="1490" y="482" class="nodeTitle" text-anchor="middle">(Next.js, Vercel)</text>
  <text x="1365" y="510" class="nodeBody">• dashboard + verification UI</text>
  <text x="1365" y="532" class="nodeBody">• share links + bundle</text>
  <text x="1365" y="550" class="nodeBody">  download</text>
  <text x="1365" y="574" class="nodeBody">• Supabase auth only;</text>
  <text x="1365" y="592" class="nodeBody">  data via API</text>

  <!-- INV-01 callout -->
  <rect class="callout" x="440" y="170" width="390" height="120" rx="10"/>
  <text x="635" y="200" class="calloutTitle" text-anchor="middle">INV-01 · Critical trust-enforcement path</text>
  <text x="635" y="224" class="calloutBody" text-anchor="middle">API independently re-fetches the uploaded S3</text>
  <text x="635" y="242" class="calloutBody" text-anchor="middle">object and recomputes SHA-256 before</text>
  <text x="635" y="260" class="calloutBody" text-anchor="middle">accepting the credential.</text>
  <text x="635" y="280" class="calloutBody" text-anchor="middle" font-weight="700">Fail-closed on any mismatch.</text>

  <!-- Edges -->

  <!-- Mobile ↔ API : presign -->
  <path class="edge" d="M 355 475 L 440 475" marker-end="url(#arr)" marker-start="url(#arrStart)"/>
  <rect class="pill" x="362" y="450" width="108" height="20" rx="10"/>
  <text x="416" y="464" class="pillText" text-anchor="middle">presign req / res</text>

  <!-- Mobile → API : submit credential -->
  <path class="edge" d="M 355 560 L 440 560" marker-end="url(#arr)"/>
  <rect class="pill" x="362" y="568" width="148" height="20" rx="10"/>
  <text x="436" y="582" class="pillText" text-anchor="middle">submit credential JSON</text>

  <!-- Mobile → S3 : direct upload (bottom route) -->
  <path class="edge" d="M 205 610 L 205 880 L 1090 880 L 1090 830" marker-end="url(#arr)"/>
  <rect class="pill" x="580" y="868" width="130" height="22" rx="11"/>
  <text x="645" y="883" class="pillText" text-anchor="middle">upload file to S3</text>

  <!-- API ↔ S3 : red re-hash path -->
  <path class="edgeRed" d="M 830 440 L 925 225" marker-end="url(#arrR)"/>
  <rect class="pillRed" x="838" y="330" width="106" height="22" rx="11"/>
  <text x="891" y="345" class="pillTextRed" text-anchor="middle">fetch object</text>

  <path class="edgeRed" d="M 925 270 L 830 475" marker-end="url(#arrR)"/>
  <rect class="pillRed" x="838" y="378" width="106" height="22" rx="11"/>
  <text x="891" y="393" class="pillTextRed" text-anchor="middle">return bytes</text>

  <!-- API ↔ Supabase -->
  <path class="edge" d="M 830 480 L 925 480" marker-end="url(#arr)" marker-start="url(#arrStart)"/>
  <rect class="pill" x="835" y="456" width="85" height="20" rx="10"/>
  <text x="877" y="470" class="pillText" text-anchor="middle">read keys</text>

  <path class="edge" d="M 830 520 L 925 520" marker-end="url(#arr)"/>
  <rect class="pill" x="835" y="498" width="85" height="20" rx="10"/>
  <text x="877" y="512" class="pillText" text-anchor="middle">insert cred</text>

  <path class="edge" d="M 830 560 L 925 560" marker-end="url(#arr)"/>
  <rect class="pill" x="835" y="538" width="85" height="20" rx="10"/>
  <text x="877" y="552" class="pillText" text-anchor="middle">TSA update</text>

  <path class="edge" d="M 830 600 L 925 600" marker-end="url(#arr)"/>
  <rect class="pill" x="835" y="608" width="85" height="20" rx="10"/>
  <text x="877" y="622" class="pillText" text-anchor="middle">audit</text>

  <!-- API ↔ TSA -->
  <path class="edge" d="M 740 630 L 740 745 L 925 745" marker-end="url(#arr)"/>
  <rect class="pill" x="748" y="695" width="115" height="20" rx="10"/>
  <text x="805" y="709" class="pillText" text-anchor="middle">timestamp query</text>

  <path class="edge" d="M 925 790 L 780 790 L 780 630" marker-end="url(#arr)"/>
  <rect class="pill" x="788" y="778" width="85" height="20" rx="10"/>
  <text x="830" y="792" class="pillText" text-anchor="middle">TSR token</text>

  <!-- Web ↔ API -->
  <path class="edge" d="M 1345 505 L 830 505" marker-end="url(#arr)" marker-start="url(#arrStart)"/>
  <rect class="pill" x="1030" y="483" width="260" height="22" rx="11"/>
  <text x="1160" y="498" class="pillText" text-anchor="middle">dashboard reads · verify · shares · bundles</text>

  <!-- Web ⇢ Supabase (auth only) -->
  <path class="edgeDash" d="M 1345 590 Q 1290 660 1255 640" marker-end="url(#arr)"/>
  <rect class="pill" x="1268" y="650" width="76" height="20" rx="10"/>
  <text x="1306" y="664" class="pillText" text-anchor="middle">auth only</text>

  <!-- Legend -->
  <rect class="legendBox" x="40" y="940" width="720" height="44" rx="8"/>
  <line x1="58" y1="962" x2="102" y2="962" class="edgeRed"/>
  <text x="112" y="966" class="nodeBody">INV-01 re-hash path (fail-closed)</text>
  <line x1="352" y1="962" x2="396" y2="962" class="edgeDash"/>
  <text x="406" y="966" class="nodeBody">auth-only relationship</text>
  <line x1="572" y1="962" x2="616" y2="962" class="edge"/>
  <text x="626" y="966" class="nodeBody">API / data flow</text>
</svg>