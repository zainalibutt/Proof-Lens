<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1850" font-family="Aptos, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8232f"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 12.5px; fill: #555; }
      .lifeline { stroke: #9aa0a6; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .laneHead { fill: #f2f3f5; stroke: #c9ccd1; stroke-width: 1; }
      .laneTitle { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .laneSub { font-size: 10.5px; fill: #6b6f76; font-style: italic; }
      .actBox { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.4; }
      .edge { stroke: #2b2b2b; stroke-width: 1.5; fill: none; }
      .edgeRed { stroke: #b8232f; stroke-width: 2; fill: none; }
      .edgeDash { stroke: #6b6f76; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .stepNumCircle { fill: #2b2b2b; }
      .stepNumCircleRed { fill: #b8232f; }
      .stepNum { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .stepText { font-size: 12.5px; fill: #1a1a1a; }
      .stepTextRed { font-size: 12.5px; fill: #b8232f; font-weight: 700; }
      .callout { fill: #fdecee; stroke: #b8232f; stroke-width: 1.4; }
      .calloutTitle { font-size: 12px; font-weight: 700; fill: #b8232f; }
      .calloutBody { font-size: 11px; fill: #b8232f; }
      .phase { fill: #eef1f5; stroke: #c9ccd1; stroke-width: 0.8; }
      .phaseText { font-size: 11px; font-weight: 700; fill: #4a4f57; letter-spacing: 1.2px; }
      .footer { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="1850"/>

  <text x="40" y="40" class="title">Figure 5.2 — Credential Submission &amp; Anchoring Pipeline</text>
  <text x="40" y="62" class="subtitle">Enforced order: capture → upload → server-side verify → anchor. Red arrows mark the INV-01 trust-enforcement path. Fail-closed on mismatch.</text>

  <!-- Lane positions: Mobile 120 | S3 310 | API 500 | DB 690 | TSA 870 -->

  <!-- Lane headers -->
  <rect class="laneHead" x="60"  y="90" width="120" height="44" rx="6"/>
  <text x="120" y="110" class="laneTitle" text-anchor="middle">Mobile App</text>
  <text x="120" y="126" class="laneSub" text-anchor="middle">untrusted client</text>

  <rect class="laneHead" x="250" y="90" width="120" height="44" rx="6"/>
  <text x="310" y="110" class="laneTitle" text-anchor="middle">AWS S3</text>
  <text x="310" y="126" class="laneSub" text-anchor="middle">object storage</text>

  <rect class="laneHead" x="440" y="90" width="120" height="44" rx="6"/>
  <text x="500" y="110" class="laneTitle" text-anchor="middle">API</text>
  <text x="500" y="126" class="laneSub" text-anchor="middle">trust anchor</text>

  <rect class="laneHead" x="630" y="90" width="120" height="44" rx="6"/>
  <text x="690" y="110" class="laneTitle" text-anchor="middle">Database</text>
  <text x="690" y="126" class="laneSub" text-anchor="middle">PostgreSQL</text>

  <rect class="laneHead" x="810" y="90" width="120" height="44" rx="6"/>
  <text x="870" y="110" class="laneTitle" text-anchor="middle">TSA</text>
  <text x="870" y="126" class="laneSub" text-anchor="middle">RFC 3161</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="120" y1="134" x2="120" y2="1720"/>
  <line class="lifeline" x1="310" y1="134" x2="310" y2="1720"/>
  <line class="lifeline" x1="500" y1="134" x2="500" y2="1720"/>
  <line class="lifeline" x1="690" y1="134" x2="690" y2="1720"/>
  <line class="lifeline" x1="870" y1="134" x2="870" y2="1720"/>

  <!-- Phase bands -->
  <rect class="phase" x="30" y="150" width="30" height="260" rx="4"/>
  <text x="45" y="280" class="phaseText" text-anchor="middle" transform="rotate(-90 45 280)">ON-DEVICE CAPTURE</text>

  <rect class="phase" x="30" y="420" width="30" height="260" rx="4"/>
  <text x="45" y="550" class="phaseText" text-anchor="middle" transform="rotate(-90 45 550)">UPLOAD</text>

  <rect class="phase" x="30" y="690" width="30" height="480" rx="4"/>
  <text x="45" y="930" class="phaseText" text-anchor="middle" transform="rotate(-90 45 930)">SERVER-SIDE VERIFY (INV-01)</text>

  <rect class="phase" x="30" y="1180" width="30" height="380" rx="4"/>
  <text x="45" y="1370" class="phaseText" text-anchor="middle" transform="rotate(-90 45 1370)">ANCHOR &amp; PERSIST</text>

  <rect class="phase" x="30" y="1570" width="30" height="140" rx="4"/>
  <text x="45" y="1640" class="phaseText" text-anchor="middle" transform="rotate(-90 45 1640)">RESPONSE</text>

  <!-- Activation bars -->
  <rect class="actBox" x="114" y="175" width="12" height="240"/>
  <rect class="actBox" x="494" y="715" width="12" height="850"/>

  <!-- Step 1: Capture media (self) -->
  <circle class="stepNumCircle" cx="90" cy="195" r="12"/>
  <text x="90" y="199" class="stepNum" text-anchor="middle">1</text>
  <path class="edge" d="M 126 195 C 165 185, 165 215, 126 210"/>
  <text x="170" y="200" class="stepText">Capture media</text>

  <!-- Step 2: Compute SHA-256 -->
  <circle class="stepNumCircle" cx="90" cy="245" r="12"/>
  <text x="90" y="249" class="stepNum" text-anchor="middle">2</text>
  <path class="edge" d="M 126 245 C 165 235, 165 265, 126 260"/>
  <text x="170" y="250" class="stepText">Compute SHA-256</text>

  <!-- Step 3: Construct credential -->
  <circle class="stepNumCircle" cx="90" cy="295" r="12"/>
  <text x="90" y="299" class="stepNum" text-anchor="middle">3</text>
  <path class="edge" d="M 126 295 C 165 285, 165 315, 126 310"/>
  <text x="170" y="300" class="stepText">Construct credential JSON</text>

  <!-- Step 4: Sign (Ed25519) -->
  <circle class="stepNumCircle" cx="90" cy="345" r="12"/>
  <text x="90" y="349" class="stepNum" text-anchor="middle">4</text>
  <path class="edge" d="M 126 345 C 165 335, 165 365, 126 360"/>
  <text x="170" y="350" class="stepText">Sign hash (Ed25519)</text>

  <!-- Step 5: Request presigned URL (Mobile → API) -->
  <circle class="stepNumCircle" cx="90" cy="450" r="12"/>
  <text x="90" y="454" class="stepNum" text-anchor="middle">5</text>
  <path class="edge" d="M 126 450 L 494 450" marker-end="url(#a2)"/>
  <text x="310" y="442" class="stepText" text-anchor="middle">Request presigned URL</text>

  <!-- Step 6: Return presigned POST (API → Mobile) -->
  <circle class="stepNumCircle" cx="90" cy="500" r="12"/>
  <text x="90" y="504" class="stepNum" text-anchor="middle">6</text>
  <path class="edge" d="M 494 500 L 126 500" marker-end="url(#a2)"/>
  <text x="310" y="492" class="stepText" text-anchor="middle">Return presigned POST</text>

  <!-- Step 7: Upload to S3 (Mobile → S3) -->
  <circle class="stepNumCircle" cx="90" cy="555" r="12"/>
  <text x="90" y="559" class="stepNum" text-anchor="middle">7</text>
  <path class="edge" d="M 126 555 L 304 555" marker-end="url(#a2)"/>
  <text x="215" y="547" class="stepText" text-anchor="middle">Upload media to S3</text>

  <!-- Step 8: Submit credential JSON (Mobile → API) -->
  <circle class="stepNumCircle" cx="90" cy="615" r="12"/>
  <text x="90" y="619" class="stepNum" text-anchor="middle">8</text>
  <path class="edge" d="M 126 615 L 494 615" marker-end="url(#a2)"/>
  <text x="310" y="607" class="stepText" text-anchor="middle">Submit credential JSON</text>

  <!-- Phase: Server-side verify -->

  <!-- Step 9: Validate auth + resolve media key (API self) -->
  <circle class="stepNumCircle" cx="470" cy="745" r="12"/>
  <text x="470" y="749" class="stepNum" text-anchor="middle">9</text>
  <path class="edge" d="M 506 745 C 545 735, 545 765, 506 760"/>
  <text x="550" y="750" class="stepText">Validate auth + resolve key</text>

  <!-- Step 10: API fetches file from S3 (API → S3) RED -->
  <circle class="stepNumCircleRed" cx="470" cy="815" r="12"/>
  <text x="470" y="819" class="stepNum" text-anchor="middle">10</text>
  <path class="edgeRed" d="M 494 815 L 316 815" marker-end="url(#a2r)"/>
  <text x="405" y="807" class="stepTextRed" text-anchor="middle">Fetch uploaded file</text>

  <!-- Step 11: Return file bytes (S3 → API) RED -->
  <circle class="stepNumCircleRed" cx="470" cy="865" r="12"/>
  <text x="470" y="869" class="stepNum" text-anchor="middle">11</text>
  <path class="edgeRed" d="M 316 865 L 494 865" marker-end="url(#a2r)"/>
  <text x="405" y="857" class="stepTextRed" text-anchor="middle">Return file bytes</text>

  <!-- Step 12: Recompute hash + compare (API self) RED -->
  <circle class="stepNumCircleRed" cx="470" cy="930" r="12"/>
  <text x="470" y="934" class="stepNum" text-anchor="middle">12</text>
  <path class="edgeRed" d="M 506 930 C 545 920, 545 950, 506 945"/>
  <text x="550" y="926" class="stepTextRed">Recompute SHA-256 + compare</text>

  <!-- Fail-closed callout #1: hash mismatch -->
  <rect class="callout" x="550" y="960" width="290" height="54" rx="8"/>
  <text x="695" y="982" class="calloutTitle" text-anchor="middle">400 hash_mismatch</text>
  <text x="695" y="1002" class="calloutBody" text-anchor="middle">fail-closed — reject, no credential written</text>
  <path class="edgeDash" d="M 545 950 L 552 975" stroke="#b8232f"/>

  <!-- Step 13: Read device public key (API → DB) -->
  <circle class="stepNumCircle" cx="470" cy="1050" r="12"/>
  <text x="470" y="1054" class="stepNum" text-anchor="middle">13</text>
  <path class="edge" d="M 506 1050 L 684 1050" marker-end="url(#a2)"/>
  <text x="595" y="1042" class="stepText" text-anchor="middle">Read device public key</text>

  <path class="edge" d="M 684 1080 L 506 1080" marker-end="url(#a2)" stroke-dasharray="3 3"/>
  <text x="595" y="1098" class="stepText" text-anchor="middle" font-style="italic" fill="#555">(public key)</text>

  <!-- Step 14: Verify signature (API self) -->
  <circle class="stepNumCircle" cx="470" cy="1135" r="12"/>
  <text x="470" y="1139" class="stepNum" text-anchor="middle">14</text>
  <path class="edge" d="M 506 1135 C 545 1125, 545 1155, 506 1150"/>
  <text x="550" y="1132" class="stepText">Verify Ed25519 signature</text>

  <!-- Fail-closed callout #2: signature failure -->
  <rect class="callout" x="550" y="1162" width="290" height="54" rx="8"/>
  <text x="695" y="1184" class="calloutTitle" text-anchor="middle">403 invalid_signature / device_key_mismatch</text>
  <text x="695" y="1204" class="calloutBody" text-anchor="middle">fail-closed — reject, no credential written</text>
  <path class="edgeDash" d="M 545 1155 L 552 1178" stroke="#b8232f"/>

  <!-- Phase: Anchor & persist -->

  <!-- Step 15: TSA request (TSQ) (API → TSA) -->
  <circle class="stepNumCircle" cx="470" cy="1260" r="12"/>
  <text x="470" y="1264" class="stepNum" text-anchor="middle">15</text>
  <path class="edge" d="M 506 1260 L 864 1260" marker-end="url(#a2)"/>
  <text x="685" y="1252" class="stepText" text-anchor="middle">TSA request (TSQ) for SHA-256</text>

  <!-- Step 16: TSA response (TSR) (TSA → API) -->
  <circle class="stepNumCircle" cx="470" cy="1310" r="12"/>
  <text x="470" y="1314" class="stepNum" text-anchor="middle">16</text>
  <path class="edge" d="M 864 1310 L 506 1310" marker-end="url(#a2)"/>
  <text x="685" y="1302" class="stepText" text-anchor="middle">TSA response (TSR token + genTime)</text>

  <!-- Step 17: Insert into DB (API → DB) -->
  <circle class="stepNumCircle" cx="470" cy="1380" r="12"/>
  <text x="470" y="1384" class="stepNum" text-anchor="middle">17</text>
  <path class="edge" d="M 506 1380 L 684 1380" marker-end="url(#a2)"/>
  <text x="595" y="1372" class="stepText" text-anchor="middle">Insert credential + TSA fields</text>

  <!-- Step 18: Upload .tsr sidecar (API → S3) -->
  <circle class="stepNumCircle" cx="470" cy="1445" r="12"/>
  <text x="470" y="1449" class="stepNum" text-anchor="middle">18</text>
  <path class="edge" d="M 494 1445 L 316 1445" marker-end="url(#a2)"/>
  <text x="405" y="1437" class="stepText" text-anchor="middle">Upload .tsr sidecar</text>

  <!-- Response phase -->

  <!-- Step 19: Return success (API → Mobile) -->
  <circle class="stepNumCircle" cx="90" cy="1615" r="12"/>
  <text x="90" y="1619" class="stepNum" text-anchor="middle">19</text>
  <path class="edge" d="M 494 1615 L 126 1615" marker-end="url(#a2)"/>
  <text x="310" y="1607" class="stepText" text-anchor="middle">Return success (credential anchored)</text>

  <!-- Legend / footer -->
  <rect x="60" y="1750" width="980" height="70" rx="8" fill="#f6f7f9" stroke="#c9ccd1"/>
  <text x="75" y="1772" class="footer" font-weight="700">Legend:</text>
  <line x1="130" y1="1768" x2="170" y2="1768" class="edgeRed"/>
  <text x="180" y="1772" class="footer">INV-01 fail-closed re-hash path</text>
  <line x1="390" y1="1768" x2="430" y2="1768" class="edge"/>
  <text x="440" y="1772" class="footer">synchronous call</text>
  <line x1="560" y1="1768" x2="600" y2="1768" class="edgeDash"/>
  <text x="610" y="1772" class="footer">failure branch</text>
  <text x="75" y="1798" class="footer" font-style="italic">Omitted for clarity: draft lookup / cleanup · duplicate short-circuit · burst auto-finalise · audit-log writes · share-link issuance.</text>
  <text x="75" y="1814" class="footer" font-style="italic">If S3 fetch fails at step 10, API returns 502 and no credential is written.</text>
</svg>